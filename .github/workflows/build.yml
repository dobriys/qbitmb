name: Build mod

on:
  push:
    branches: [main]
  schedule:
    # daily: pick up new qBittorrent versions from linuxserver/qbittorrent:latest
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      qbt_version:
        description: "qBittorrent version, e.g. 5.2.4 (empty = version in linuxserver/qbittorrent:latest)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve qBittorrent version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.qbt_version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/qbitmb-mod"

          if [[ -n "${INPUT_VERSION:-}" ]]; then
            version="${INPUT_VERSION}"
            tags="${image}:${version}"
            latest=false
          else
            # label looks like "5.3.0_v2.1.2-ls484"
            label=$(docker buildx imagetools inspect docker.io/linuxserver/qbittorrent:latest \
              --format '{{ json (index .Image "linux/amd64").Config.Labels }}' \
              | jq -r '."org.opencontainers.image.version"')
            version="${label%%_*}"
            tags="${image}:${version},${image}:latest"
            latest=true
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected qBittorrent version: '${version}'"
            exit 1
          fi

          skip=false
          if [[ "${GITHUB_EVENT_NAME}" == "schedule" ]] \
            && docker buildx imagetools inspect "${image}:${version}" > /dev/null 2>&1; then
            echo "${image}:${version} already exists, nothing to do"
            skip=true
          fi

          {
            echo "version=${version}"
            echo "tags=${tags}"
            echo "latest=${latest}"
            echo "skip=${skip}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Docker Buildx
        if: steps.version.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: steps.version.outputs.skip != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: QBT_VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.version.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.description=qBittorrent stock WebUI with a macOS look and speed in bits (kbit/s, Mbit/s), as a linuxserver.io docker mod
            org.opencontainers.image.licenses=GPL-2.0-or-later
            org.opencontainers.image.version=${{ steps.version.outputs.version }}

      # the same WebUI as a zip, for installs without Docker
      - name: Export WebUI files
        if: steps.version.outputs.skip != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: webui
          build-args: QBT_VERSION=${{ steps.version.outputs.version }}
          outputs: type=local,dest=webui-out

      - name: Publish release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          LATEST: ${{ steps.version.outputs.latest }}
        run: |
          set -euo pipefail
          (cd webui-out && zip -qr ../qbitmb.zip qbitmb)

          tag="qbt-${VERSION}"
          cat > notes.md <<EOF
          qbitmb WebUI for qBittorrent ${VERSION}.

          Extract \`qbitmb.zip\` and point **Options → WebUI → Use alternative WebUI → Files location** to the \`qbitmb\` folder. See the [README](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#readme) for details.

          Built from ${GITHUB_SHA::7}.
          EOF

          # one release per qBittorrent version, rebuilt from the latest commit
          gh release delete "${tag}" --repo "${GITHUB_REPOSITORY}" --yes --cleanup-tag 2>/dev/null || true
          gh release create "${tag}" qbitmb.zip \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "qbitmb for qBittorrent ${VERSION}" \
            --notes-file notes.md \
            --latest="${LATEST}"
